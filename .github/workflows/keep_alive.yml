name: Keep Streamlit App Alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Stealth Ping Streamlit App
        # 防止陷入死循环，强制返回成功状态
        run: |
          curl -sL --max-redirs 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" https://ctmr2026.streamlit.app > /dev/null || true
          echo "Ping executed successfully!"
